<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Student Login</title>

    <style>
      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
    </style>
    <link rel="stylesheet" href="../ui-polish.css" />
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 flex items-center justify-center px-4"
  >
    <div
      class="w-full max-w-md bg-white/95 backdrop-blur rounded-3xl shadow-2xl shadow-black/20 p-8 sm:p-10 border border-white/10"
    >
      <!-- Brand Header -->
      <div class="text-center mb-8">
        <div
          class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-indigo-600/25"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
            <path d="M6 12v5c3 3 9 3 12 0v-5" />
          </svg>
        </div>

        <h1 class="text-2xl font-bold text-slate-900">SMIT Student Portal</h1>

        <p class="mt-2 text-slate-500 text-sm">
          Welcome back! Sign in to continue your learning.
        </p>
      </div>

      <div class="space-y-5">
        <div>
          <label
            for="email"
            class="block text-sm font-semibold text-slate-700 mb-2"
          >
            Email Address
          </label>

          <div class="relative">
            <span
              class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="20" height="16" x="2" y="4" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
            </span>

            <input
              type="email"
              placeholder="Enter Email Address"
              id="email"
              class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 placeholder-slate-400 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 focus:bg-white"
            />
          </div>
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-semibold text-slate-700 mb-2"
          >
            Password
          </label>

          <div class="relative">
            <span
              class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>

            <input
              type="password"
              placeholder="Enter Password"
              id="password"
              class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 placeholder-slate-400 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 focus:bg-white"
            />
          </div>
        </div>

        <button
          id="login"
          class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-semibold shadow-lg shadow-indigo-600/20 transition duration-200 hover:-translate-y-0.5 cursor-pointer"
        >
          Login
        </button>
        <button onclick="signUpLogin">SignIn with Google</button>
      </div>

      <div class="text-center mt-7 space-y-2">
        <a
          href="./signup.html"
          class="block text-sm text-slate-500 hover:text-indigo-600 transition"
        >
          Don't have an account? Sign up
        </a>

        <!-- <a
          href="../Admin Site/admin.html"
          class="block text-sm text-slate-400 hover:text-indigo-600 transition"
        >
          Admin Login
        </a> -->
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>

        authDomain: "quiz-app-69264.firebaseapp.com",

        projectId: "quiz-app-69264",
        storageBucket: "quiz-app-69264.firebasestorage.app",
        messagingSenderId: "439853114863",
        appId: "1:439853114863:web:07f05c1e30ac016851821a",
      };

      firebase.initializeApp(firebaseConfig);
    </script>

    <script src="login.js"></script>
  </body>
</html>
