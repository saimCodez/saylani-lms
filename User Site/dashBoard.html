<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student ID Card</title>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- for pdf create and download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 20px;
      }

      .page {
        text-align: center;
        width: 100%;
        max-width: 760px;
      }

      .page-title {
        margin-bottom: 28px;
        color: #ffffff;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      /* CARD */

      .card {
        width: 700px;
        max-width: 100%;
        min-height: 410px;
        background: #ffffff;
        border-radius: 28px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 24px 55px rgba(0, 0, 0, 0.35);
        margin: 0 auto;
        text-align: left;
      }

      /* HEADER */

      .card-header {
        height: 120px;
        padding: 22px 34px;
        background: linear-gradient(135deg, #111827 0%, #2563eb 100%);
        color: white;
        display: flex;
        align-items: center;
        gap: 20px;
        position: relative;
      }

      .card-header::after {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        width: 160px;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.06) 100%
        );
        pointer-events: none;
      }

      .logo {
        width: 72px;
        height: 72px;
        background: #ffffff;
        color: #2563eb;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 800;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        z-index: 1;
      }

      .header-text {
        text-align: left;
        z-index: 1;
      }

      .header-text h2 {
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }

      .header-text p {
        font-size: 12px;
        font-weight: 600;
        opacity: 0.85;
        margin-top: 6px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* CONTENT */

      .card-content {
        display: flex;
        padding: 36px;
        gap: 34px;
      }

      /* LEFT */

      .student-section {
        flex: 1;
        display: flex;
        gap: 26px;
        text-align: left;
      }

      .student-image {
        width: 135px;
        height: 165px;
        object-fit: cover;
        border-radius: 16px;
        border: 3px solid #e2e8f0;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .student-details {
        flex: 1;
      }

      .student-details h2 {
        color: #111827;
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 6px;
        line-height: 1.2;
      }

      .role {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #2563eb;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 22px;
        padding: 6px 12px;
        background: #eff6ff;
        border-radius: 999px;
      }

      .detail {
        margin-bottom: 14px;
      }

      .detail label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .detail span {
        font-size: 15px;
        color: #1e293b;
        font-weight: 600;
      }

      /* RIGHT */

      .qr-section {
        width: 185px;
        border-left: 1px solid #e2e8f0;
        padding-left: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #qrcode {
        width: 130px;
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        padding: 10px;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
      }

      #qrcode img {
        width: 110px !important;
        height: 110px !important;
      }

      .qr-section p {
        margin-top: 14px;
        font-size: 11px;
        color: #64748b;
        text-align: center;
        line-height: 1.5;
        font-weight: 500;
      }

      .verified {
        margin-top: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 16px;
        border-radius: 999px;
        background: #dcfce7;
        color: #15803d;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .verified svg {
        width: 13px;
        height: 13px;
      }

      /* FOOTER */

      .card-footer {
        background: #111827;
        color: white;
        padding: 16px 34px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 500;
      }

      .card-footer span {
        color: #60a5fa;
        font-weight: 600;
      }

      .card-number {
        letter-spacing: 1.5px;
        font-weight: 600;
        color: #cbd5e1;
      }

      /* DOWNLOAD PDF BUTTON */

      .download-btn {
        margin-top: 28px;
        padding: 14px 30px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(79, 70, 229, 0.3);
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .download-btn svg {
        width: 18px;
        height: 18px;
      }

      .download-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 34px rgba(79, 70, 229, 0.4);
      }

      .download-btn:active {
        transform: translateY(0);
      }

      /* MOBILE */

      @media (max-width: 750px) {
        .card {
          width: 100%;
        }

        .card-content {
          gap: 22px;
          padding: 28px;
        }

        .student-section {
          gap: 18px;
        }

        .student-image {
          width: 110px;
          height: 140px;
        }

        .qr-section {
          width: 155px;
          padding-left: 18px;
        }

        #qrcode,
        #qrcode img {
          width: 110px !important;
          height: 110px !important;
        }
      }

      @media (max-width: 600px) {
        .card-header {
          padding: 18px 22px;
          height: auto;
          min-height: 100px;
        }

        .logo {
          width: 58px;
          height: 58px;
          font-size: 16px;
        }

        .header-text h2 {
          font-size: 20px;
        }

        .card-content {
          flex-direction: column;
          padding: 24px;
        }

        .student-section {
          width: 100%;
        }

        .student-details h2 {
          font-size: 22px;
        }

        .qr-section {
          width: 100%;
          border-left: none;
          border-top: 1px solid #e2e8f0;
          padding-left: 0;
          padding-top: 24px;
        }

        .card-footer {
          flex-direction: column;
          gap: 8px;
          text-align: center;
        }
      }
    </style>
    <link rel="stylesheet" href="../ui-polish.css" />
  </head>

  <body>
    <div class="page">
      <h2 class="page-title">Student ID Card Preview</h2>

      <div class="card" id="card">
        <!-- HEADER -->

        <div class="card-header">
          <div class="logo">SMIT</div>

          <div class="header-text">
            <h2>SMIT Hyderabad</h2>
            <p>Student Identity Card</p>
          </div>
        </div>

        <!-- CONTENT -->

        <div class="card-content">
          <!-- LEFT SIDE -->

          <div class="student-section">
            <img
              id="stdImage"
              class="student-image"
              src="https://res.cloudinary.com/oxd4g5j7/image/upload/v1786879008/kpxz6dzggtj8pfywkwhz.png"
              alt="Student"
            />

            <div class="student-details">
              <h2 id="studentName"></h2>

              <div class="role" id="role"></div>

              <div class="detail">
                <label>Email</label>
                <span id="studentEmail">student@gmail.com</span>
              </div>

              <div class="detail">
                <label>Course</label>
                <option id="studentCourse" key=${value.coursekey}>${value.courseName}</option>
              </div>
            </div>
          </div>

          <!-- RIGHT SIDE -->

          <div class="qr-section">
            <div id="qrcode"></div>

            <p>
              Scan to verify<br />
              student identity
            </p>

            <div class="verified">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              Verified
            </div>
          </div>
        </div>

        <!-- FOOTER -->

        <div class="card-footer">
          <div>Property of <span>SMIT Hyderabad</span></div>

          <div class="card-number" id="footerStudentId">SMIT-10245</div>
        </div>
      </div>

      <button onclick="pdfDownload()" class="download-btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" x2="12" y1="15" y2="3" />
        </svg>
        Download PDF
      </button>

      <button><a href="./QuizView.html">View All Quiz</a></button>
    </div>

  </body>
</html>
