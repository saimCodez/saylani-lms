<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; -webkit-font-smoothing: antialiased; }
        img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
        .dashboard { display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: #0f172a; color: white; position: fixed; left: 0; top: 0; bottom: 0; overflow-y: auto; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 28px 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sidebar-brand h2 { font-size: 18px; font-weight: 700; color: #f8fafc; }
        .sidebar-brand span { font-size: 11px; font-weight: 500; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .menu { list-style: none; padding: 16px 12px; flex: 1; }
        .menu-label { font-size: 10px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 1.2px; padding: 16px 12px 8px; }
        .menu li { margin-bottom: 2px; }
        .menu a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #94a3b8; padding: 11px 14px; border-radius: 10px; transition: all 0.2s ease; font-size: 14px; font-weight: 500; }
        .menu a:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }
        .menu a.active { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .menu a svg { width: 18px; height: 18px; flex-shrink: 0; }
        .sidebar-footer { padding: 16px 12px; border-top: 1px solid rgba(255,255,255,0.06); }
        .sidebar-footer a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #64748b; padding: 11px 14px; border-radius: 10px; transition: all 0.2s ease; font-size: 14px; font-weight: 500; }
        .sidebar-footer a:hover { background: rgba(239,68,68,0.1); color: #ef4444; }
        .sidebar-footer a svg { width: 18px; height: 18px; }

        .main { margin-left: 260px; width: calc(100% - 260px); }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 24px 32px; background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10; }
        .topbar-left h1 { font-size: 22px; font-weight: 700; color: #0f172a; }
        .topbar-left p { font-size: 13px; color: #64748b; margin-top: 2px; }
        .admin-badge { display: flex; align-items: center; gap: 10px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 50px; }
        .admin-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; }
        .admin-avatar svg { width: 16px; height: 16px; color: white; }
        .admin-badge span { font-size: 13px; font-weight: 600; color: #334155; }
        .content-area { padding: 28px 32px; }

        .table-box { background: white; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; }
        .table-header { padding: 20px 24px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
        .table-header h2 { font-size: 16px; font-weight: 700; color: #0f172a; }
        .count-badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: #f1f5f9; color: #475569; }

        table { width: 100%; border-collapse: collapse; }
        thead tr { background: #f8fafc; }
        th { padding: 12px 24px; text-align: left; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid #e2e8f0; }
        td { padding: 14px 24px; font-size: 14px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        tbody tr { transition: background 0.15s ease; }
        tbody tr:hover { background: #f8fafc; }
        tbody tr:last-child td { border-bottom: none; }

        .hide { display: none; }
        .show { display: block; }

        .student-name { font-weight: 600; color: #0f172a; }
        .student-email { font-size: 13px; color: #64748b; }

        .course {
            display: inline-block;
            padding: 4px 10px;
            background: #eff6ff;
            color: #3b82f6;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.active, .status { background: #ecfdf5; color: #059669; }
        .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #10b981; display: inline-block; }

        .profile-container { display: flex; align-items: center; }
        .student-profile { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; border: 2px solid #e2e8f0; }
        .no-image {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 10px;
            background: #f1f5f9; color: #94a3b8;
            font-size: 10px; font-weight: 600;
        }

        #loading { text-align: center; padding: 60px 0; }
        #loading img { width: 120px; height: 120px; border-radius: 0; opacity: 0.7; }

        .mobile-toggle { display: none; background: none; border: none; color: #334155; cursor: pointer; padding: 8px; border-radius: 8px; }
        .mobile-toggle:hover { background: #f1f5f9; }
        .mobile-toggle svg { width: 22px; height: 22px; }
        .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
        .mobile-overlay.show { display: block; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; z-index: 100; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; width: 100%; }
            .topbar { padding: 16px 20px; }
            .content-area { padding: 20px; }
            .mobile-toggle { display: flex !important; }
            .table-box { overflow-x: auto; }
            table { min-width: 700px; }
        }
    </style>
    <link rel="stylesheet" href="../ui-polish.css">
</head>

<body>

                <li><a href="#"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> Settings</a></li>
            </ul>
            <div class="sidebar-footer"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> Logout</a></div>
        </aside>

        <main class="main">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="mobile-toggle" onclick="toggleSidebar()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
                    <div class="topbar-left"><h1>Students</h1><p>All registered students</p></div>
                </div>
                <div class="admin-badge">
                    <div class="admin-avatar"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>

            </div>

            <div class="content-area">
                <div id="loading">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="" />
                </div>

                <section class="table-box hide" id="maintable">
                    <div class="table-header">
                        <h2>Student Directory</h2>
                        <span class="count-badge">All Students</span>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>S.No</th>

                                <th>Email</th>
                                <th>Course</th>
                                <th>Profile</th>

                            </tr>
                        </thead>
                        <tbody id="users"></tbody>
                    </table>
                </section>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('mobileOverlay').classList.toggle('show');
        }
