<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - SMIT Quiz Portal</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      *, *::before, *::after { font-family: 'Inter', sans-serif; }
      body { -webkit-font-smoothing: antialiased; }
      input::placeholder { font-weight: 400; }
      .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        pointer-events: none;
      }
      .admin-input {
        padding-left: 44px !important;
      }
      .btn-admin {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #4338ca 100%);
        transition: all 0.25s ease;
      }
      .btn-admin:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(79, 70, 229, 0.35);
      }
      .btn-admin:active {
        transform: translateY(0);
      }
      .card-shadow {
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255,255,255,0.05);
      }
      .brand-gradient {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
      }
      .divider-line {
        flex: 1;
        height: 1px;
        background: #e2e8f0;
      }
    </style>
    <link rel="stylesheet" href="../ui-polish.css" />
  </head>

  <body class="min-h-screen flex items-center justify-center px-4" style="background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 40%, #0f172a 100%);">

    <div class="w-full max-w-md">

      <div class="bg-white rounded-3xl card-shadow overflow-hidden">

        <div class="brand-gradient px-8 pt-10 pb-12 text-center">
          <div class="w-16 h-16 bg-white/20 backdrop-blur rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-white tracking-tight">Admin Portal</h1>
          <p class="text-white/70 text-sm mt-1">SMIT Quiz Management System</p>
        </div>

        <div class="px-8 py-8 sm:px-10">

          <div class="mb-8">
            <h2 class="text-xl font-semibold text-slate-900">Welcome back</h2>
            <p class="text-sm text-slate-500 mt-1">Sign in to your admin account</p>
          </div>

          <div class="space-y-5">
            <div>
              <label for="email" class="block text-sm font-medium text-slate-700 mb-2">
                Email Address
              </label>
              <div class="relative">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
                <input
                  type="email"
                  placeholder="admin@smit.edu"
                  id="email"
                  class="admin-input w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 placeholder-slate-400 outline-none transition-all duration-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 focus:bg-white"
                />
              </div>
            </div>

            <div>
              <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
                Password
              </label>
              <div class="relative">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input
                  type="password"
                  placeholder="Enter your password"
                  id="password"
                  class="admin-input w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 placeholder-slate-400 outline-none transition-all duration-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 focus:bg-white"
                />
              </div>
            </div>

            <button
              onclick="login()"
              class="w-full py-3.5 rounded-xl btn-admin text-white font-semibold text-sm tracking-wide cursor-pointer"
            >
              Sign In to Admin Panel
            </button>
          </div>

          <div class="flex items-center gap-3 mt-6">
            <span class="divider-line"></span>
            <span class="text-xs text-slate-400 font-medium">SECURE LOGIN</span>
            <span class="divider-line"></span>
          </div>

          <div class="text-center mt-4">
            <a
              href="../User Site/login.html"
              class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-indigo-600 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
              </svg>
              Back to Student Login
            </a>
          </div>
        </div>
      </div>

      <p class="text-center text-xs text-slate-500 mt-6">
        SMIT Hyderabad &mdash; Admin Access Only
      </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>

    <script>

        apiKey: "AIzaSyD154DKlJKJ_ok1ig17V-na7LvUWBa3V0E",

      };
      firebase.initializeApp(firebaseConfig);
    </script>

    <script src="adminLogin.js\ji"></script>
  </body>
</html>
